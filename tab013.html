<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IVIS4 hotel – Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --navy: #111936;
      --cream: #f6f4ef;
      --text: #171717;
      --muted: #6f6f6f;
      --logo-col: 150px;
      --logo-gap: 54px;
      --logo-nudge: 0px;

      --side-gap: 20px;
      --media-gap: 20px;
      --sticky-top: 98px;
      --parallax-extra: 22%;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      overflow-x: clip;
      scroll-behavior: smooth;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 74px;
      background: rgba(17, 25, 54, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
    }

    .site-header .inner {
      width: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand img {
      height: 34px;
      width: auto;
      display: block;
    }

    .header-spacer {
      height: 74px;
    }

    .project-head {
      background: #fff;
      border-bottom: 1px solid #ededed;
      padding-top: 16px;
      padding-bottom: 8px;
    }

    .project-head .wrap {
      padding-left: var(--side-gap);
      padding-right: var(--side-gap);
    }

    .project-head-content {
      display: block;
    }

    .project-logo {
      width: var(--logo-col);
      height: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      transform: translateY(var(--logo-nudge));
    }

    .project-logo img {
      width: 100%;
      height: auto;
      max-height: var(--logo-col);
      object-fit: contain;
      display: block;
    }

    .project-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.0;
      letter-spacing: -0.04em;
    }

    /* ===== Full-width δίστηλο: κείμενο 1 μέρος, media 3 μέρη ===== */

    .project-body {
      padding: 40px var(--side-gap) 80px;
      display: grid;
      grid-template-columns: minmax(18rem, 1fr) minmax(0, 3fr);
      column-gap: var(--media-gap);
      align-items: start;
    }

    .project-text {
      position: sticky;
      top: var(--sticky-top);
    }

    .project-text p {
      margin: 0 0 1.5em;
      font-size: 19px;          /* μεγαλύτερο κείμενο */
      line-height: 1.55;
      color: #111;              /* μαύρο */
    }

    .text-cats-label {
      font-weight: 700;
      font-size: 19px;
      color: #111;
      margin: 0 0 4px;
    }

    .text-cats {
      margin: 0;
      font-size: 19px;
      line-height: 1.5;
      color: #111;
    }

    /* ===== Δεξιά στήλη media με stacking:
       κάθε block είναι sticky, οπότε το επόμενο ανεβαίνει
       και το σκεπάζει καθώς σκρολάρεις. Το λευκό padding-top
       δημιουργεί το μικρό λευκό κενό ανάμεσά τους. ===== */

    .project-media {
      min-width: 0;
    }

    .media-stack {
      position: sticky;
      top: var(--sticky-top);
      background: #fff;
      padding-top: var(--media-gap);   /* το λευκό κενάκι */
      margin-top: calc(-1 * var(--media-gap));
    }

    .media-stack:first-child {
      margin-top: 0;
      padding-top: 0;
    }

    .media-stack + .media-stack {
      margin-top: var(--media-gap);
    }

    .media-item {
      overflow: hidden;
      background: #efefef;
      position: relative;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Φαρδιές εικόνες με parallax */
    .media-wide {
      aspect-ratio: 16 / 9;
    }

    .media-wide img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + var(--parallax-extra));
      object-fit: cover;
      object-position: center;
      will-change: transform;
    }

    /* Λογότυπο μέσα στη στήλη media, ίδια αναλογία με media-wide */
    .media-logo {
      aspect-ratio: auto;
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-logo img {
      position: static;
      width: auto;
      height: auto;
      max-width: 50%;
      max-height: 50%;
      object-fit: contain;
    }

    /* Ζευγάρι εικόνων δίπλα-δίπλα */
    .media-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--media-gap);
    }

    .media-pair .media-item {
      aspect-ratio: 0.8 / 1;
    }

    .media-pair .media-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Reveal όταν μπαίνει στην οθόνη */
    .js-inview {
      clip-path: inset(clamp(30px, 6vw, 100px));
      transform: scale(0.95);
      opacity: 0.4;
      transition:
        clip-path 900ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 900ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 900ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .js-inview.is-visible {
      clip-path: inset(0px);
      transform: scale(1);
      opacity: 1;
    }

    .site-footer {
      position: relative;       /* να κάθεται πάνω από τα sticky media */
      z-index: 10;
      background: #fff;
      color: var(--muted);
      border-top: 1px solid #efefef;
      padding: 22px var(--side-gap);
      font-size: 14px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* ===== Responsive ===== */

    @media (max-width: 991.98px) {
      .project-body {
        grid-template-columns: 1fr;
        row-gap: 32px;
      }
      .project-text {
        position: static;
      }
      .media-stack {
        position: static;        /* χωρίς stacking σε στενές οθόνες */
        padding-top: 0;
        margin-top: 0;
      }
      .media-stack + .media-stack {
        margin-top: var(--media-gap);
      }
    }

    @media (max-width: 575.98px) {
      :root {
        --logo-col: 60px;
        --logo-gap: 12px;
        --logo-nudge: 0px;
        --media-gap: 12px;
        --side-gap: 16px;
      }
      .site-header .inner {
        padding-left: 16px;
        padding-right: 16px;
      }
      .project-text p,
      .text-cats,
      .text-cats-label {
        font-size: 17px;
      }
      .media-pair {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .js-inview {
        clip-path: inset(0px);
        transform: none;
        opacity: 1;
        transition: none;
      }
      .media-wide img {
        height: 100%;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html" aria-label="Back to portfolio">
        <img src="images/farm logo w.svg" alt="The Farm logo">
      </a>
    </div>
  </header>
  <div class="header-spacer"></div>

  <section class="project-head">
    <div class="wrap">
      <div class="project-head-content">
        <!-- PROJECT LOGO SLOT — β' φάση
        <div class="project-logo"><img src="images/..." alt=""></div>
        -->
        <div>
          <!-- PROJECT TITLE SLOT — β' φάση
          <h1 class="project-title">PROJECT TITLE</h1>
          -->
        </div>
      </div>
    </div>
  </section>

  <section class="project-body">

    <!-- Αριστερή στήλη: κείμενα — προσωρινά κρυμμένα (β' φάση) -->
    <div class="project-text">
      <!--
      <p>Project description</p>
      <div class="text-cats-label">Categories</div>
      <p class="text-cats">Categories list</p>
      -->
    </div>

    <!-- Δεξιά στήλη: media με stacking -->
    <div class="project-media">

      <div class="media-stack">
        <div class="media-item media-wide js-inview js-parallax">
          <img src="images/FINALS/ivis4/ivis42.webp" alt="">
        </div>
      </div>
      <div class="media-stack">
        <div class="media-pair">
          <div class="media-item js-inview">
            <img src="images/FINALS/ivis4/ivis43.webp" alt="">
          </div>
          <div class="media-item js-inview">
            <img src="images/FINALS/ivis4/ivis45.webp" alt="">
          </div>
        </div>
      </div>
      <div class="media-stack">
        <div class="media-item media-wide js-inview js-parallax">
          <img src="images/FINALS/ivis4/ivis47.webp" alt="">
        </div>
      </div>
      <div class="media-stack">
        <div class="media-item media-wide js-inview js-parallax">
          <img src="images/FINALS/ivis4/ivis46.webp" alt="">
        </div>
      </div>
    </div>

  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>© The Farm. All rights reserved.</div>
      <!-- PROJECT NAME SLOT — β' φάση: <div>Project name</div> -->
    </div>
  </footer>

  <script>
    // ===== Reveal όταν η εικόνα μπαίνει στην οθόνη =====
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.25 });

    document.querySelectorAll('.js-inview').forEach((el) => revealObserver.observe(el));

    // ===== Parallax στις φαρδιές εικόνες =====
    const parallaxItems = document.querySelectorAll('.js-parallax');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateParallax() {
      const vh = window.innerHeight;
      parallaxItems.forEach((item) => {
        const rect = item.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > vh) return;
        const progress = (vh - rect.top) / (vh + rect.height);
        const img = item.querySelector('img');
        const extra = img.offsetHeight - rect.height;
        img.style.transform = 'translateY(' + (-extra * progress) + 'px)';
      });
    }

    if (!reduceMotion && parallaxItems.length) {
      let ticking = false;
      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(() => {
            updateParallax();
            ticking = false;
          });
          ticking = true;
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      updateParallax();
    }
  </script>
</body>
</html>
